name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_DB: papertrail
          POSTGRES_USER: papertrail
          POSTGRES_PASSWORD: papertrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papertrail -d papertrail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PAPERTRAIL_DATABASE_URL: postgresql+psycopg://papertrail:papertrail@localhost:5432/papertrail
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: python -m pytest
